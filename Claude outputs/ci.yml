name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  client:
    name: Client (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  server:
    name: Server (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: "file:./prisma/ci.db"
      JWT_SECRET: "ci-secret-not-for-production"
      NODE_ENV: "test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:api
      - run: npm run build
